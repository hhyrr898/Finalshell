name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Build Eleventy site
        env:
          SITE_URL: ${{ vars.SITE_URL != '' && vars.SITE_URL || 'https://finalshell-ssh.com' }}
        run: npm run build
      # Pages must be enabled once in repo Settings → Pages → Source: GitHub Actions.
      # If you have a PAT with repo/pages scope, set secret REPO_ADMIN_TOKEN to auto-enable.
      - name: Configure GitHub Pages (auto-enable)
        if: ${{ secrets.REPO_ADMIN_TOKEN != '' }}
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.REPO_ADMIN_TOKEN }}
      - name: Configure GitHub Pages
        if: ${{ secrets.REPO_ADMIN_TOKEN == '' }}
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
